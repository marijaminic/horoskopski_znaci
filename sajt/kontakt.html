<!DOCTYPE html>
<head>
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/kontakt.css">
</head>
<body>
    <h1>IZRADA NATALNE KARTE:</h1>
    <p id="nekiPasus">Sve dodatne informacije, kao i izradu i tumačenje natalne karte mozete dobiti putem kontakt forme:</p>
    <form action="" id="contact-form">
        <div>
            <label for="name">Ime:</label>
            <input type="text" id="name" class="contact-input">
        </div>
        <div>
            <label for="mail">Mejl:</label>
            <input type="email" id="mail" class="contact-input">
        </div>
        <button type="submit" id="contact-btn">Pošalji:</button>
    </form>
    </form>
    <script src="js/kontakt.js"></script>
</body>
</html>
